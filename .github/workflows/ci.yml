name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo deb --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: termide-deb-ci
          path: target/debian/*.deb